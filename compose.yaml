services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: licenciagraph-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3000}:3000"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  falkordb_data:

